# Adds a real Chromium binary to the Railway build so lib/audit/performance.ts (real
# Lighthouse, §17.3) has a browser to launch. Without this, Mr. Audit still runs — the
# deterministic catalogue (lib/audit/checks.ts) needs no browser at all — but the
# performance pass reports itself as skipped (see performance.ts's own chromePath()
# fallback) instead of crashing the whole audit.
#
# chrome-launcher searches PATH itself for "chromium", "chromium-browser", "google-chrome",
# etc. — a nix package on PATH is enough, no PUPPETEER_EXECUTABLE_PATH env var required. Set
# that var only if this ever needs pointing at a specific binary instead (docs/MANUAL_STEPS.md).
#
# python3 is for src/lib/research/conduct_research.py (Mr. Writer's gpt-researcher step,
# §16.3 Upgrade E) — same "one service" reasoning as chromium above: one more binary in the
# same container, not a second Railway service.
#
# nodejs_22 IS EXPLICIT HERE ON PURPOSE. Declaring [phases.setup] at all replaces Nixpacks'
# auto-detected setup phase rather than extending it — so without listing the Node package
# ourselves, the image that comes out has no npm at all, and the very next phase's `npm ci`
# fails with "npm: command not found" (exit 127). Found 2026-08-29 after the deployed
# agent-server had been stuck 2+ days on a stale build because every push since this file
# started declaring [phases.setup] had been silently failing at this exact step. Version
# pinned to match package.json's "engines": { "node": ">=22.12.0" }.
[phases.setup]
nixPkgs = ["nodejs_22", "chromium", "python3"]

# Nix's python3 lives under the immutable /nix/store and is PEP 668 "externally managed" —
# neither `pip install` nor `ensurepip` are allowed to write packages into it (both tried and
# failed here, 2026-08-29: "No module named pip", then "externally-managed-environment"). The
# fix every guide for this recommends and the only one that actually worked: build a venv
# (a normal, non-nix-managed directory) and install requirements.txt into THAT instead.
[phases.researchDeps]
dependsOn = ["setup"]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
]

# lib/research/gptResearcher.ts spawns `process.env.PYTHON_BIN || "python3"` — pointing it at
# the venv's interpreter (which has gpt-researcher installed) instead of the bare nix python3
# (which doesn't) is what actually makes the research step work at runtime, not just the build
# succeed. Set here rather than as a manual Railway Variable so it can't be forgotten on a
# redeploy or a fresh environment.
[variables]
PYTHON_BIN = "/opt/venv/bin/python3"
